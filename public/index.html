<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ad fontes — a scripture study partner</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>ad fontes</h1>
    <p class="tagline">Translations, the original Greek or Hebrew, commentary, and a summary — for any passage, in one look.</p>
  </header>

  <main>
    <form id="search-form">
      <input
        id="ref-input"
        type="text"
        placeholder="e.g. John 3:16, Genesis 1:1, Romans 8:28"
        autocomplete="off"
        autofocus
      />
      <button type="submit">Go</button>
    </form>

    <div class="examples">
      <span>Try:</span>
      <button type="button" class="example" data-ref="John 3:16">John 3:16</button>
      <button type="button" class="example" data-ref="Genesis 1:1">Genesis 1:1</button>
      <button type="button" class="example" data-ref="Psalm 23:1">Psalm 23:1</button>
      <button type="button" class="example" data-ref="Romans 8:28">Romans 8:28</button>
      <button type="button" class="example" data-ref="1 Corinthians 13:4">1 Corinthians 13:4</button>
    </div>

    <div id="status" class="status" hidden></div>
    <div id="results" hidden></div>
  </main>

  <footer>
    <p>
      Text &amp; lexicons: <a href="https://github.com/STEPBible/STEPBible-Data" target="_blank" rel="noopener">STEPBible / Tyndale House Cambridge</a> (CC BY 4.0).
      Commentary: public domain, via <a href="https://biblehub.com" target="_blank" rel="noopener">biblehub.com</a>.
      Translations: <a href="https://developers.youversion.com" target="_blank" rel="noopener">YouVersion Platform API</a>.
    </p>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
