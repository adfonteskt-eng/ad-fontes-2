<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ad fontes — a scripture study partner</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>ad fontes</h1>
    <p class="tagline">Ask about any passage — translations, the original Greek or Hebrew, and commentary come along to help you understand it.</p>
  </header>

  <main>
    <div class="chat-heading-row">
      <div class="examples">
        <span>Try:</span>
        <button type="button" class="example" data-question="What does John 3:16 mean?">John 3:16</button>
        <button type="button" class="example" data-question="What does Genesis 1:1 tell us about creation?">Genesis 1:1</button>
        <button type="button" class="example" data-question="What kind of love does Paul describe in 1 Corinthians 13:4?">1 Cor 13:4</button>
        <button type="button" class="example" data-question="What does Romans 8:28 actually promise?">Romans 8:28</button>
      </div>
      <button type="button" id="chat-clear" title="Start a new conversation">New conversation</button>
    </div>

    <div id="chat-log" aria-live="polite"></div>

    <form id="chat-form">
      <textarea
        id="chat-input"
        rows="2"
        placeholder="e.g. John 3:16, or &quot;what kind of love does Paul mean in 1 Corinthians 13:4?&quot;"
        autofocus
      ></textarea>
      <button type="submit">Send</button>
    </form>
  </main>

  <footer>
    <p>
      Text &amp; lexicons: <a href="https://github.com/STEPBible/STEPBible-Data" target="_blank" rel="noopener">STEPBible / Tyndale House Cambridge</a> (CC BY 4.0).
      Commentary: public domain, via <a href="https://biblehub.com" target="_blank" rel="noopener">biblehub.com</a>.
      Translations: <a href="https://developers.youversion.com" target="_blank" rel="noopener">YouVersion Platform API</a>.
    </p>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
