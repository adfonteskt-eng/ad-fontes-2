# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Lets Render provision this service from repo config instead of manual
# dashboard clicking: on render.com, "New +" -> "Blueprint", point it at this
# repo, and Render reads this file. Secrets (marked sync: false below) still
# have to be typed into the Render dashboard by hand — a Blueprint can't see
# your .env, and shouldn't (this file is committed to the repo).
#
# data/ (STEPBible text files, ~105 MB) is deliberately not part of the repo
# or a persistent disk — the CC BY 4.0 licence on that data asks that it be
# distributed from a single source rather than redistributed (see README ->
# Data & licence), so buildCommand re-fetches it fresh from GitHub on every
# deploy instead. That also means there's nothing here that needs a paid
# persistent-disk add-on: the free plan's ephemeral filesystem is exactly
# what this wants, since a fresh fetch on every build is the point, not a
# workaround.
services:
  - type: web
    name: ad-fontes
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install && npm run fetch-data
    startCommand: npm run web
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.12.0

      # Required — set these by hand in the Render dashboard after the
      # first deploy (Environment tab). The build will succeed without
      # them, but the site will report the matching feature as
      # unconfigured until they're set.
      - key: YVP_APP_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

      # Optional but strongly recommended in production — without these,
      # chat sessions and the usage caps below both reset on every restart
      # (Render restarts free-plan services periodically, not just on
      # deploy). See README -> Website for what this trades off.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

      # Optional — enables accounts (magic-link sign-in/up), the
      # compounding study memory, sermon/lesson outline mode, and the
      # top-left "previous conversations" menu. Without these, the site
      # runs exactly as it does today: no sign-in widget appears at all
      # (see GET /api/config). See README -> Accounts & study memory and
      # supabase/schema.sql for setup.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false

      # Optional — enables push notifications (see README -> PWA & push
      # notifications and lib/push.js). Only the public key is needed here
      # (GET /api/config hands it to the browser to subscribe with) — the
      # matching private key is only needed by the ad-fontes-daily-push cron
      # service below, which is what actually sends. Without this, GET
      # /api/config reports vapidPublicKey: null and the "Notify me on this
      # device" toggle in the account menu stays hidden. Generate a pair
      # with `npx web-push generate-vapid-keys` (see .env.example).
      - key: VAPID_PUBLIC_KEY
        sync: false

      # Optional tuning — safe to leave unset and use the code defaults.
      # Uncomment (and remove sync: false) to pin a value here instead of
      # setting it in the dashboard.
      # - key: SUMMARY_MODEL
      #   value: claude-sonnet-5
      # - key: CHAT_DAILY_LIMIT
      #   value: "60"
      # - key: SUMMARY_DAILY_LIMIT
      #   value: "40"

  # Sends the daily digest email (today's featured passage) to every
  # opted-in signed-in user — see lib/daily-digest.js and
  # scripts/send-daily-digest.js. Runs independently of the web service
  # above: same repo/build, different entry point, on its own schedule.
  #
  # NOTE: this does NOT require upgrading the Render *workspace* off the
  # free Hobby plan — Cron Job services are available there too. What it
  # does require: Cron Jobs have no free *compute* tier the way web
  # services do (see render.com/pricing -> Cron Jobs — pricing starts at
  # $0.00016/minute on the cheapest "Starter" instance type, billed only
  # while the job is actually running, prorated to the second). A script
  # that runs for a few seconds once a day costs a small fraction of a
  # cent per run in compute — Render's own marketing floor rounds this up
  # to "from $1/month," which is the realistic ballpark to expect, not
  # anything close to a paid-plan-sized cost. Everything this service
  # depends on (RESEND_API_KEY, DIGEST_FROM_EMAIL, Supabase config) is
  # additive and harmless to leave unset if you'd rather skip it entirely.
  - type: cron
    name: ad-fontes-daily-digest
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm install
    startCommand: npm run digest
    # Once a day at 12:00 UTC (8am US Eastern / 5am US Pacific) — arbitrary
    # reasonable default; adjust to when your users are actually awake.
    schedule: "0 12 * * *"
    envVars:
      - key: NODE_VERSION
        value: 20.12.0

      # Required for this service specifically — see .env.example. Without
      # these, `npm run digest` exits nonzero (Render will report the cron
      # run as failed) rather than silently doing nothing.
      - key: RESEND_API_KEY
        sync: false
      - key: DIGEST_FROM_EMAIL
        sync: false

      # Required — this job needs Supabase to know who's opted in, same
      # values as the web service above (Render doesn't share env vars
      # between services, so these have to be entered twice).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false

      # Optional — defaults to https://adfontes.site if unset (see
      # lib/daily-digest.js). Only needed if this ever runs against a
      # different deployment.
      # - key: PUBLIC_SITE_URL
      #   value: https://adfontes.site

  # Sends push notifications (see README -> PWA & push notifications and
  # lib/push.js): the daily-passage push to every device with notifications
  # on, plus the reading-plan-reminder push to opted-in paid users with an
  # unfinished plan. Same "separate cron service, same repo/build, own
  # schedule" shape as ad-fontes-daily-digest above, and the same real-but-
  # tiny Cron Job compute cost reasoning (see that service's own comment) —
  # nothing here requires leaving the free Hobby workspace plan either.
  - type: cron
    name: ad-fontes-daily-push
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm install
    startCommand: npm run push
    # Same time as the email digest — arbitrary, adjust to taste. There's no
    # requirement these two cron services fire together; they're independent
    # channels for (mostly) the same "today's passage" content.
    schedule: "0 12 * * *"
    envVars:
      - key: NODE_VERSION
        value: 20.12.0

      # Required for this service specifically (see .env.example for how to
      # generate these). Without them, `npm run push` exits nonzero.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false

      # Required — this job needs Supabase to know who has push
      # subscriptions and who's opted into reading-plan reminders, same
      # values as the other services (Render doesn't share env vars between
      # services, so these have to be entered again here too).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false

      # Optional — same default/override reasoning as the digest cron above.
      # - key: PUBLIC_SITE_URL
      #   value: https://adfontes.site
